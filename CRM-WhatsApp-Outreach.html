<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM & WhatsApp Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f5; --card:#ffffff; --text:#13201c; --muted:#5c6d68; --border:#e2e9e6;
  --primary:#0fa968; --primary-d:#0c8a55; --primary-soft:#e3f7ee;
  --accent:#f4781f; --accent-soft:#fdeadd;
  --blue:#0ea5e9; --danger:#e1264a; --danger-soft:#fde6ea; --warn:#d99a13; --warn-soft:#fbf0d8;
  --radius:16px; --shadow:0 1px 2px rgba(20,40,30,.04), 0 8px 24px rgba(20,40,30,.05);
  --font-h:'Plus Jakarta Sans',sans-serif; --font-b:'Inter',sans-serif;
}
[data-theme="dark"]{
  --bg:#0d1411; --card:#141f1a; --text:#e9f3ee; --muted:#8aa39a; --border:#223129;
  --primary-soft:#11302322; --accent-soft:#2a1d12;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);transition:background .2s,color .2s}
h1,h2,h3,.brand,.navitem,button{font-family:var(--font-h)}
a{color:var(--primary-d);text-decoration:none}
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;font-weight:800;font-size:15px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--shadow)}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;background:none;border:none;text-align:left;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:600;width:100%}
.navitem:hover{background:var(--primary-soft);color:var(--text)}
.navitem.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.navitem .ic{font-size:16px;width:20px;text-align:center}
.sidebar-foot{font-size:11px;color:var(--muted);padding:10px 8px}
.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:20px;margin:0;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{font-family:var(--font-b);font-size:13.5px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{width:100%;resize:vertical;line-height:1.5}
button{cursor:pointer;font-weight:700;font-size:13px;border-radius:10px;border:1px solid transparent;padding:9px 15px;display:inline-flex;align-items:center;gap:6px;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--primary-d)}
.btn-outline{background:var(--card);color:var(--text);border-color:var(--border)}
.btn-outline:hover{background:var(--primary-soft)}
.btn-ghost{background:transparent;color:var(--muted);padding:7px 9px}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat-card{display:flex;align-items:center;gap:12px}
.stat-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat-num{font-size:23px;font-weight:800;line-height:1}
.stat-lbl{font-size:11.5px;color:var(--muted);margin-top:3px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-new{background:var(--border);color:var(--muted)}
.badge-sent{background:#dbeafe;color:#1d4ed8}
.badge-delivered{background:#e0e7ff;color:#4338ca}
.badge-read{background:#dcfce7;color:#15803d}
.badge-interested{background:var(--primary-soft);color:var(--primary-d)}
.badge-notinterested{background:var(--danger-soft);color:var(--danger)}
.badge-followup{background:var(--warn-soft);color:var(--warn)}
.badge-noreply{background:var(--border);color:var(--muted)}
.modal-overlay{position:fixed;inset:0;background:rgba(10,18,15,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadein .15s ease;padding:16px}
.modal{background:var(--card);border-radius:18px;padding:24px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:320px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:13px;display:flex;gap:9px;animation:fadein .2s ease}
.toast b{display:block;margin-bottom:1px}
.empty{text-align:center;padding:54px 20px;color:var(--muted);border:1.5px dashed var(--border);border-radius:var(--radius)}
.empty .e-ic{font-size:30px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--card)}
.chip:hover{background:var(--primary-soft)}
.tabs{display:inline-flex;background:var(--border);border-radius:10px;padding:3px;gap:2px}
.tab{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.preview-bubble{background:#dcf8c6;border-radius:16px;padding:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.5;color:#0c2611}
[data-theme="dark"] .preview-bubble{background:#1f3a28;color:#dff4e4}
.search-wrap{position:relative}
.search-wrap input{padding-left:32px;width:200px}
.search-wrap span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.q-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.q-item:last-child{border-bottom:none}
.countdown{font-weight:800;font-size:13px;color:var(--accent)}
.leadlist{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:6px}
.leadlist label{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.leadlist label:hover{background:var(--primary-soft)}
.muted{color:var(--muted)}
.mb-0{margin-bottom:0}
.flex-between{display:flex;align-items:center;justify-content:space-between}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.upload-box{border:2px dashed var(--border);border-radius:14px;padding:36px;text-align:center;cursor:pointer}
.upload-box:hover{background:var(--primary-soft)}
.dup-flag{color:var(--warn);font-size:11px}
@media(max-width:760px){
  .app{flex-direction:column}
  .sidebar{position:fixed;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);padding:6px;z-index:50}
  .brand,.sidebar-foot{display:none}
  nav{flex-direction:row;width:100%;overflow-x:auto}
  .navitem{flex-direction:column;font-size:10px;gap:3px;flex:1;white-space:nowrap;padding:6px 4px}
  .main{padding:16px 14px 90px}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">💬</div><div>CRM Outreach<br><span class="muted" style="font-weight:500;font-size:11px">Standalone Edition</span></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Runs 100% in your browser.<br>No server, no cost.</div>
  </aside>
  <main class="main">
    <div id="main-content"></div>
  </main>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ============================= DATA LAYER ============================= */
const LS_KEY = 'crm_whatsapp_outreach_v1';
const STATUSES = ["New","Sent","Delivered","Read","Interested","Not Interested","Follow Up","No Reply"];
const STATUS_CLASS = {New:"badge-new",Sent:"badge-sent",Delivered:"badge-delivered",Read:"badge-read",Interested:"badge-interested","Not Interested":"badge-notinterested","Follow Up":"badge-followup","No Reply":"badge-noreply"};

function genId(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultData(){
  return {
    leads: [],
    templates: [{
      id: genId(), name: "Cold Outreach v1", timesUsed:0, timesReplied:0, createdAt: Date.now(),
      content: "Hi {{name}}\nI am from {{sender}}.\nWe have verified manufacturers and exporters of {{product}}.\nQuantity Required: {{qty}}\nCountry: {{country}}\nIf you're looking for suppliers, kindly let us know.\nThank you."
    }],
    campaigns: [],
    history: [],
    settings: { companyName:"My Company", senderName:"Sales Team", logoEmoji:"💬", darkMode:false, minDelay:15, maxDelay:35, baileysUrl:"http://localhost:3001" }
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    return Object.assign(d, parsed, { settings: Object.assign(d.settings, parsed.settings||{}) });
  }catch(e){ return defaultData(); }
}
let DB = loadDB();
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }

/* ============================= HELPERS ============================= */
function normalizePhone(raw){ let p=(raw||'').toString().replace(/[^\d+]/g,''); if(p && !p.startsWith('+')) p='+'+p; return p; }
function isValidPhone(raw){ const p=normalizePhone(raw); return /^\+\d{8,15}$/.test(p); }
function isValidEmail(raw){ if(!raw) return true; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(raw).trim()); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(ts){ return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Built-in CSV parser (replaces PapaParse — zero external dependencies) ---- */
function parseCSVText(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip, \n handles row end */ }
      else if(c === '\n'){ row.push(field); field=''; rows.push(row); row=[]; }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v=>v && v.trim()!==''));
}
function parseCSVToObjects(text){
  const rows = parseCSVText(text);
  if(rows.length===0) return { headers:[], data:[] };
  const headers = rows[0].map(h=>h.trim());
  const data = rows.slice(1).map(r=>{ const obj={}; headers.forEach((h,i)=> obj[h]=(r[i]||'').trim()); return obj; });
  return { headers, data };
}

/* ---- Built-in chart drawing (pure SVG/CSS — replaces Chart.js, zero external dependencies) ---- */
function drawLineChart(id, labels, data, color){
  const el = document.getElementById(id); if(!el) return;
  const w = 600, h = 170, pad = 22;
  const max = Math.max(1, ...data);
  const stepX = (w - pad*2) / Math.max(1, data.length-1);
  const pts = data.map((v,i)=> [pad + i*stepX, h - pad - (v/max)*(h-pad*2-10)]);
  const path = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)} ${h-pad} L${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const everyN = Math.ceil(labels.length/7);
  const labelEls = labels.map((l,i)=> i%everyN===0 ? `<text x="${pts[i][0].toFixed(1)}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${l}</text>` : '').join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <path d="${area}" fill="${color}" opacity="0.12"></path>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
    ${labelEls}</svg>`;
}
function drawBarChart(id, labels, data, color){
  const el = document.getElementById(id); if(!el) return;
  const w = 600, h = 170, pad = 22;
  const max = Math.max(1, ...data);
  const barSlot = (w - pad*2) / data.length;
  const everyN = Math.ceil(labels.length/7);
  const bars = data.map((v,i)=>{
    const barH = (v/max) * (h - pad*2 - 6);
    const x = pad + i*barSlot + barSlot*0.18;
    const y = h - pad - barH;
    const lbl = i%everyN===0 ? `<text x="${(x+barSlot*0.32).toFixed(1)}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${labels[i]}</text>` : '';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barSlot*0.64).toFixed(1)}" height="${Math.max(barH,1).toFixed(1)}" rx="3" fill="${color}"></rect>${lbl}`;
  }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${bars}</svg>`;
}
function drawDonut(id, labels, data, colors){
  const el = document.getElementById(id); if(!el) return;
  const total = data.reduce((a,b)=>a+b,0) || 1;
  let acc = 0;
  const stops = data.map((v,i)=>{ const start=acc/total*360; acc+=v; const end=acc/total*360; return `${colors[i]} ${start.toFixed(1)}deg ${end.toFixed(1)}deg`; }).join(', ');
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:18px;justify-content:center;height:170px;flex-wrap:wrap">
      <div style="width:120px;height:120px;border-radius:50%;background:conic-gradient(${stops});flex-shrink:0;box-shadow:var(--shadow)"></div>
      <div>${labels.map((l,i)=>`<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:6px"><span style="width:10px;height:10px;border-radius:50%;background:${colors[i]};display:inline-block;flex-shrink:0"></span>${escapeHtml(l)}: <b>${data[i]}</b></div>`).join('')}</div>
    </div>`;
}
function renderTemplate(content, lead){
  const map = { name:lead.name, company:lead.company, product:lead.product, qty:lead.qty, country:lead.country, email:lead.email, sender: DB.settings.senderName||'' };
  return (content||'').replace(/\{\{\s*(\w+)\s*\}\}/g, (m,k)=>{ k=k.toLowerCase(); const v = map[k]; return (v!==undefined && v!=='' && v!==null) ? v : `[${k}]`; });
}
function flagDuplicates(){
  const seen = {};
  DB.leads.forEach(l=>{ const key=l.phone; seen[key]=(seen[key]||0)+1; });
  DB.leads.forEach(l=>{ l.isDuplicate = seen[l.phone] > 1; });
}
function toast(title, desc, variant){
  const wrap = document.getElementById('toasts');
  const icons = {success:'✅',error:'⛔',warning:'⚠️',info:'ℹ️'};
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span>${icons[variant]||icons.info}</span><div><b>${escapeHtml(title)}</b>${desc?`<span class="muted">${escapeHtml(desc)}</span>`:''}</div>`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function openModal(html){ document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`; }
function confirmDialog(title, desc, onConfirm, danger){
  openModal(`
    <h2>${escapeHtml(title)}</h2>
    <p class="sub">${escapeHtml(desc)}</p>
    <div class="modal-foot">
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
      <button class="${danger?'btn-danger':'btn-primary'}" id="confirm-btn">Confirm</button>
    </div>`);
  document.getElementById('confirm-btn').onclick = ()=>{ onConfirm(); closeModal(); };
}

/* ============================= ROUTER / NAV ============================= */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'📊'},
  {id:'leads', label:'Leads', icon:'👥'},
  {id:'templates', label:'Templates', icon:'📝'},
  {id:'campaigns', label:'Campaigns', icon:'📤'},
  {id:'history', label:'History', icon:'🕐'},
  {id:'analytics', label:'Analytics', icon:'📈'},
  {id:'settings', label:'Settings', icon:'⚙️'},
];
let state = { view:'dashboard', leadFilters:{search:'',status:'all',country:'',product:''}, csvPreview:null, csvMapping:null };

function renderNav(){
  document.getElementById('nav').innerHTML = NAV_ITEMS.map(item=>
    `<button class="navitem ${state.view===item.id?'active':''}" data-action="nav" data-view="${item.id}"><span class="ic">${item.icon}</span>${item.label}</button>`
  ).join('');
}
function go(view){ state.view = view; renderApp(); }

function renderApp(){
  document.documentElement.setAttribute('data-theme', DB.settings.darkMode ? 'dark':'light');
  renderNav();
  const root = document.getElementById('main-content');
  flagDuplicates();
  const renderers = { dashboard: renderDashboard, leads: renderLeads, templates: renderTemplates, campaigns: renderCampaigns, history: renderHistory, analytics: renderAnalytics, settings: renderSettings };
  root.innerHTML = renderers[state.view]();
  afterRender[state.view] && afterRender[state.view]();
}
const afterRender = {};

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const totalLeads = DB.leads.length;
  const messagesSent = DB.history.length;
  const interested = DB.leads.filter(l=>l.status==='Interested').length;
  const pending = DB.leads.filter(l=>l.status==='New'||l.status==='Follow Up').length;
  const todayStr = new Date().toDateString();
  const sentToday = DB.history.filter(h=>new Date(h.sentAt).toDateString()===todayStr).length;

  const stats = [
    {label:'Total Leads', val:totalLeads, ic:'👥', bg:'var(--primary-soft)', color:'var(--primary-d)'},
    {label:'Messages Sent', val:messagesSent, ic:'📤', bg:'#e0f2fe', color:'#0369a1'},
    {label:'Interested Buyers', val:interested, ic:'👍', bg:'var(--primary-soft)', color:'var(--primary-d)'},
    {label:'Pending', val:pending, ic:'⏳', bg:'var(--warn-soft)', color:'var(--warn)'},
    {label:"Today's Sent", val:sentToday, ic:'📅', bg:'var(--accent-soft)', color:'var(--accent)'},
  ];

  const recent = [...DB.history].sort((a,b)=>b.sentAt-a.sentAt).slice(0,8);

  return `
    <div class="topbar"><h1>Dashboard</h1></div>
    <div class="stat-grid">
      ${stats.map(s=>`<div class="card stat-card"><div class="stat-ic" style="background:${s.bg};color:${s.color}">${s.ic}</div><div><div class="stat-num">${s.val}</div><div class="stat-lbl">${s.label}</div></div></div>`).join('')}
    </div>
    <div class="grid-2">
      <div class="card"><h3 style="margin-top:0">Leads Added (14 days)</h3><div id="chart-leads"></div></div>
      <div class="card"><h3 style="margin-top:0">Interest Rate</h3><div id="chart-interest"></div></div>
    </div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card"><h3 style="margin-top:0">Messages Sent Daily</h3><div id="chart-sent"></div></div>
      <div class="card">
        <h3 style="margin-top:0">Recent Activity</h3>

function openCsvModal(){
  openModal(`
    <h2>Bulk Upload Leads (CSV)</h2>
    <p class="sub">Columns are auto-mapped: Name, Company, Phone, Email, Product, Qty, Country.</p>
    <div id="csv-body">
      <label class="upload-box" style="display:block">
        <div style="font-size:26px">📁</div>
        <div><b>Click to select a CSV file</b></div>
        <div class="muted" style="font-size:12px">or drag and drop</div>
        <input type="file" accept=".csv" style="display:none" id="csv-input">
      </label>
    </div>`);
  document.getElementById('csv-input').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const { headers, data } = parseCSVToObjects(reader.result);
      if(headers.length===0){ toast('Could not read CSV','File appears empty or invalid','error'); return; }
      const aliases = { name:['name','full name','contact name'], company:['company','company name','business'], phone:['phone','whatsapp','whatsapp number','mobile','contact number'], email:['email','email address'], product:['product','item','requirement'], qty:['qty','quantity','required qty'], country:['country','location','region'] };
      const mapping = {};
      Object.entries(aliases).forEach(([field, alts])=>{ const m = headers.find(h=>alts.includes(h.trim().toLowerCase())); if(m) mapping[field]=m; });
      const rows = data.map(r=>{
        const get = f => mapping[f] ? (r[mapping[f]]||'').trim() : '';
        const phone = normalizePhone(get('phone'));
        const email = get('email');
        return { name:get('name'), company:get('company'), phone, email, product:get('product'), qty:get('qty'), country:get('country'), phoneValid:isValidPhone(phone), emailValid:isValidEmail(email) };
      });
      renderCsvPreview(rows);
    };
    reader.readAsText(file);
  };
}
function renderCsvPreview(rows){
  document.getElementById('csv-body').innerHTML = `
    <p class="muted" style="font-size:12.5px">${rows.length} rows detected — review before importing.</p>
    <div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:10px">
      <table><thead><tr><th>Name</th><th>Company</th><th>Phone</th><th>Product</th><th>Qty</th><th>Country</th><th>Valid</th></tr></thead>
      <tbody>${rows.slice(0,80).map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.company)}</td><td>${escapeHtml(r.phone)}</td><td>${escapeHtml(r.product)}</td><td>${escapeHtml(r.qty)}</td><td>${escapeHtml(r.country)}</td><td>${r.phoneValid?'<span class="badge badge-interested">OK</span>':'<span class="badge badge-notinterested">Invalid #</span>'}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="modal-foot">
      <button class="btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="csv-import">Import ${rows.length} Leads</button>
    </div>`;
  document.getElementById('csv-import').onclick = ()=>{
    let inserted=0, skipped=0;
    const existingPhones = new Set(DB.leads.map(l=>l.phone));
    rows.forEach(r=>{
      if(!r.name || !r.phone || !r.phoneValid){ skipped++; return; }
      if(existingPhones.has(r.phone)){ skipped++; return; }
      existingPhones.add(r.phone);
      DB.leads.push({ id:genId(), createdAt:Date.now(), source:'csv', status:'New', emailValid:true, ...r });
      inserted++;
    });
    saveDB(); closeModal(); renderApp();
    toast('Import complete', `${inserted} imported, ${skipped} skipped`, 'success');
  };
}

  }
  const next = campaign.queue.find(q=>q.status==='Pending');
  if(!next || campaign.status!=='Running'){ const el=document.getElementById('queue-countdown'); if(el) el.textContent=''; return; }
  let remaining = next.delaySeconds!=null ? next.delaySeconds : 0;
  const update = ()=>{
    const el = document.getElementById('queue-countdown'); const btn = document.getElementById('send-now-btn');
    if(!el) { clearInterval(countdownTimer); return; }
    if(remaining<=0){
      el.textContent = 'Ready to send →';
      if(btn){ btn.disabled=false; btn.textContent='Send to '+( (DB.leads.find(l=>l.id===next.leadId)||{}).name || 'lead'); }
      clearInterval(countdownTimer);
    } else {
      el.textContent = `Next message ready in ${remaining}s`;
      remaining--;
    }
  };
  update();
  countdownTimer = setInterval(update, 1000);
}
function sendQueueItem(campaignId, queueId){
  const c = DB.campaigns.find(c=>c.id===campaignId);
  const q = c.queue.find(q=>q.id===queueId);
  const lead = DB.leads.find(l=>l.id===q.leadId);
  if(!lead) return;
  const url = `https://wa.me/${lead.phone.replace('+','')}?text=${encodeURIComponent(q.message)}`;
  window.open(url, '_blank');
  q.status = 'Sent';
  DB.history.push({ id:genId(), leadId:lead.id, leadName:lead.name, company:lead.company, phone:lead.phone, message:q.message, status:'Sent', sentAt:Date.now(), reply:'' });
  lead.status = 'Sent';
  const tpl = DB.templates.find(t=>t.id===c.templateId); if(tpl) tpl.timesUsed++;
  const remaining = c.queue.filter(q=>q.status==='Pending').length;
  if(remaining===0) c.status='Completed';
  saveDB();
  renderApp();
  if(state.view==='campaign-detail') startQueueCountdown(c);
}

/* ---- Baileys-powered automatic sending (free, no manual tap, real risk — see Settings) ---- */
async function checkBaileysStatus(){
  const url = (DB.settings.baileysUrl||'http://localhost:3001').replace(/\/$/,'');
  try{
    const res = await fetch(url + '/status', { method:'GET' });
    const data = await res.json();
    state.baileysConnected = !!data.connected;
  }catch(e){
    state.baileysConnected = false;
  }
  if(state.view==='campaign-detail' || state.view==='settings') renderApp();
}
function startAutoSend(campaignId){
  const c = DB.campaigns.find(c=>c.id===campaignId);
  if(!c) return;
  c.status = 'Running'; saveDB();
  autoSend.running = true; autoSend.campaignId = campaignId;
  toast('Auto-send started', 'Sending one by one with random delays — keep this tab open.', 'success');
  renderApp();
  processAutoSendStep(campaignId);
}
function stopAutoSend(){
  autoSend.running = false;
  if(autoSend.timer) clearTimeout(autoSend.timer);
  const c = DB.campaigns.find(c=>c.id===autoSend.campaignId);
  if(c && c.status==='Running'){ c.status='Paused'; saveDB(); }
  toast('Auto-send stopped','You can resume or restart auto-send anytime.','warning');
  renderApp();
}
async function processAutoSendStep(campaignId){
  if(!autoSend.running || autoSend.campaignId!==campaignId) return;
  const c = DB.campaigns.find(c=>c.id===campaignId);
  if(!c || c.status==='Paused'){ autoSend.running=false; return; }

  const next = c.queue.find(q=>q.status==='Pending');
  if(!next){ c.status='Completed'; saveDB(); autoSend.running=false; renderApp(); toast('Campaign completed','All queued messages processed.','success'); return; }

  const lead = DB.leads.find(l=>l.id===next.leadId);
  if(!lead || !isValidPhone(lead.phone)){
    next.status='Skipped'; saveDB(); renderApp();
    if(autoSend.running) processAutoSendStep(campaignId);
    return;
  }

  const baileysUrl = (DB.settings.baileysUrl||'http://localhost:3001').replace(/\/$/,'');
  try{
    const res = await fetch(baileysUrl + '/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ to: lead.phone, message: next.message })
    });
    const data = await res.json();
    if(!res.ok || !data.success) throw new Error(data.error || 'Send failed');
    next.status = 'Sent';
    DB.history.push({ id:genId(), leadId:lead.id, leadName:lead.name, company:lead.company, phone:lead.phone, message:next.message, status:'Sent', sentAt:Date.now(), reply:'' });
    lead.status = 'Sent';
    const tpl = DB.templates.find(t=>t.id===c.templateId); if(tpl) tpl.timesUsed++;
  }catch(err){
    next.status = 'Failed';
    toast('Failed to send to '+lead.name, String(err.message||err), 'error');
  }
  saveDB();
  if(state.view==='campaign-detail') renderApp();

  if(!autoSend.running) return;
  const minD = DB.settings.minDelay||15, maxD = DB.settings.maxDelay||35;
  const delayMs = (Math.floor(Math.random()*(maxD-minD+1))+minD) * 1000;
  autoSend.timer = setTimeout(()=>processAutoSendStep(campaignId), delayMs);
}
function createCampaign(){
  const name = document.getElementById('cw-name').value.trim();
  const tplId = document.getElementById('cw-template').value;
  if(!name || !tplId || campaignDraft.leadIds.size===0) return toast('Missing info','Name, template and at least one lead are required.', 'warning');
  const tpl = DB.templates.find(t=>t.id===tplId);
  const leadIds = Array.from(campaignDraft.leadIds);
  const validLeads = leadIds.map(id=>DB.leads.find(l=>l.id===id)).filter(l=>l && l.phoneValid!==false && isValidPhone(l.phone));
  const minD = DB.settings.minDelay||15, maxD = DB.settings.maxDelay||35;
  const queue = validLeads.map((l,i)=>({ id:genId(), leadId:l.id, message: renderTemplate(tpl.content, l), status:'Pending', delaySeconds: i===0?0: Math.floor(Math.random()*(maxD-minD+1))+minD }));
  const campaign = { id:genId(), name, templateId:tplId, leadIds, status:'Running', createdAt:Date.now(), queue };
  DB.campaigns.push(campaign);
  saveDB();
  campaignDraft = {name:'', templateId:'', leadIds:new Set()};
  toast('Campaign created', 'Messages are queued with random delays.', 'success');
  openCampaignQueue(campaign.id);
}

/* ============================= ANALYTICS ============================= */
function renderAnalytics(){
  const totalLeads = DB.leads.length;
  const interested = DB.leads.filter(l=>l.status==='Interested').length;
  const interestRate = totalLeads>0 ? Math.round(interested/totalLeads*100) : 0;
  const totalSent = DB.history.length;
  const responded = DB.leads.filter(l=>['Read','Delivered','Interested','Not Interested','Follow Up'].includes(l.status)).length;
  const responseRate = totalSent>0 ? Math.round(responded/totalSent*100): 0;

  const byCountry = {}; DB.leads.forEach(l=>{ const k=l.country||'Unknown'; byCountry[k]=(byCountry[k]||0)+1; });
  const byProduct = {}; DB.leads.forEach(l=>{ const k=l.product||'Unknown'; byProduct[k]=(byProduct[k]||0)+1; });
  const topCountries = Object.entries(byCountry).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const tplPerf = DB.templates.map(t=>{
    const sentLeadsIds = DB.history.filter(h=>{ return true; }).map(h=>h.leadId);
    const interestedCount = DB.leads.filter(l=> l.status==='Interested' ).length; // approximate (single-template campaigns assumed)
    return { name:t.name, used:t.timesUsed, rate: t.timesUsed>0 ? Math.round((interestedCount/Math.max(totalLeads,1))*100) : 0 };
  }).sort((a,b)=>b.rate-a.rate).slice(0,5);

  return `
    <div class="topbar">
      <h1>Analytics</h1>
      <div class="row">
        <button class="btn-outline" data-action="export-leads-csv">⬇ Leads CSV</button>
        <button class="btn-outline" data-action="export-json-backup">⬇ Full Backup (JSON)</button>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card stat-card"><div class="stat-ic" style="background:var(--primary-soft);color:var(--primary-d)">📈</div><div><div class="stat-num">${interestRate}%</div><div class="stat-lbl">Interested Percentage</div></div></div>
      <div class="card stat-card"><div class="stat-ic" style="background:#e0f2fe;color:#0369a1">💬</div><div><div class="stat-num">${responseRate}%</div><div class="stat-lbl">Response Rate</div></div></div>
    </div>
    <div class="grid-2">
      <div class="card"><h3 style="margin-top:0">🌍 Country Wise Leads</h3>
        ${topCountries.length===0?'<p class="muted">No data yet.</p>':topCountries.map(([k,v])=>`<div class="q-item"><span>${escapeHtml(k)}</span><span class="badge badge-new">${v}</span></div>`).join('')}
      </div>
      <div class="card"><h3 style="margin-top:0">📦 Product Wise Leads</h3>
        ${topProducts.length===0?'<p class="muted">No data yet.</p>':topProducts.map(([k,v])=>`<div class="q-item"><span>${escapeHtml(k)}</span><span class="badge badge-new">${v}</span></div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h3 style="margin-top:0">🏆 Top Performing Templates</h3>
      ${tplPerf.length===0 ? '<p class="muted">No template data yet.</p>' : tplPerf.map(t=>`<div class="q-item"><div><b style="font-size:13px">${escapeHtml(t.name)}</b><div class="muted" style="font-size:11px">${t.used} sent</div></div><span class="badge badge-interested">${t.rate}% interest</span></div>`).join('')}
    </div>`;
}
function exportLeadsCsv(){
  const cols = ['name','company','phone','email','product','qty','country','status'];
  const header = ['Name','Company','WhatsApp','Email','Product','Quantity','Country','Status'].join(',');
  const body = DB.leads.map(l=>cols.map(c=>`"${String(l[c]||'').replace(/"/g,'""')}"`).join(',')).join('\n');

function exportJsonBackup(){ downloadFile('crm-backup.json', JSON.stringify(DB, null, 2), 'application/json'); }
function downloadFile(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ============================= EVENT DELEGATION ============================= */
document.body.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  switch(action){
    case 'nav': go(el.dataset.view); break;
    case 'open-lead-form': openLeadForm(null); break;
    case 'edit-lead': openLeadForm(DB.leads.find(l=>l.id===id)); break;
    case 'delete-lead': deleteLead(id); break;
    case 'open-csv': openCsvModal(); break;
    case 'open-template-editor': openTemplateEditor(null); break;
    case 'edit-template': openTemplateEditor(DB.templates.find(t=>t.id===id)); break;
    case 'delete-template': deleteTemplate(id); break;
    case 'campaign-tab': state.campaignTab = el.dataset.tab; renderApp(); break;
    case 'toggle-all-leads': {
      const eligible = DB.leads.filter(l=>['New','Follow Up','No Reply'].includes(l.status));
      if(campaignDraft.leadIds.size===eligible.length) campaignDraft.leadIds = new Set();
      else campaignDraft.leadIds = new Set(eligible.map(l=>l.id));
      renderApp(); break;
    }
    case 'create-campaign': createCampaign(); break;
    case 'open-campaign': openCampaignQueue(id); break;
    case 'back-to-campaigns': state.view='campaigns'; renderApp(); break;
    case 'pause-campaign': { const c=DB.campaigns.find(c=>c.id===id); c.status='Paused'; saveDB(); renderApp(); break; }
    case 'resume-campaign': { const c=DB.campaigns.find(c=>c.id===id); c.status='Running'; saveDB(); renderApp(); break; }
    case 'skip-invalid': {
      const c=DB.campaigns.find(c=>c.id===id);
      c.queue.forEach(q=>{ const lead = DB.leads.find(l=>l.id===q.leadId); if(q.status==='Pending' && (!lead || !isValidPhone(lead.phone))) q.status='Skipped'; });
      saveDB(); renderApp(); toast('Invalid numbers skipped','','success'); break;
    }
    case 'retry-failed': {
      const c=DB.campaigns.find(c=>c.id===id);
      c.queue.forEach(q=>{ if(q.status==='Failed') q.status='Pending'; });
      if(c.status==='Completed') c.status='Running';
      saveDB(); renderApp(); toast('Failed messages re-queued','','success'); break;
    }
    case 'send-queue-item': sendQueueItem(el.dataset.cid, el.dataset.qid); break;
    case 'start-autosend': startAutoSend(id); break;
    case 'stop-autosend': stopAutoSend(); break;
    case 'check-baileys': toast('Checking…','Contacting Baileys service','info'); checkBaileysStatus(); break;
    case 'save-baileys-url': {
      DB.settings.baileysUrl = document.getElementById('set-baileysurl').value.trim() || 'http://localhost:3001';
      saveDB(); toast('Baileys URL saved','Click Check Connection to verify','success'); break;
    }
    case 'mark-interested': markLeadStatus(id, 'Interested'); break;
    case 'mark-not-interested': markLeadStatus(id, 'Not Interested'); break;
    case 'export-history-csv': exportHistoryCsv(); break;
    case 'export-leads-csv': exportLeadsCsv(); break;
    case 'export-json-backup': exportJsonBackup(); break;
    case 'save-profile': {
      DB.settings.companyName = document.getElementById('set-company').value.trim();
      DB.settings.senderName = document.getElementById('set-sender').value.trim();
      saveDB(); toast('Profile saved','','success'); break;
    }
    case 'save-sending': {
      DB.settings.minDelay = parseInt(document.getElementById('set-mindelay').value)||15;
      DB.settings.maxDelay = parseInt(document.getElementById('set-maxdelay').value)||35;
      saveDB(); toast('Sending settings saved','','success'); break;
    }
    case 'save-ui': {
      DB.settings.darkMode = document.getElementById('set-dark').checked;
      saveDB(); renderApp(); toast('Saved','','success'); break;
    }
    case 'settings-tab': state.settingsTab = el.dataset.tab; renderApp(); break;
    case 'clear-all-data': confirmDialog('Clear all data?','This permanently deletes every lead, template, campaign and history record in this browser.', ()=>{ DB=defaultData(); saveDB(); renderApp(); toast('All data cleared','','success'); }, true); break;
  }
});
document.body.addEventListener('change', (e)=>{
  if(e.target.matches('[data-lead-check]')){
    const id = e.target.dataset.leadCheck;

  document.documentElement.setAttribute('data-theme', DB.settings.darkMode ? 'dark':'light');

  afterRender[state.view] && afterRender[state.view]();
};
